name: Compilar instalador de Windows

# contents: write permite publicar el release del instalador con el token del workflow.
permissions:
  contents: write

on:
  workflow_dispatch:        # permite ejecutarlo a mano desde la pestaña Actions
  push:
    tags:
      - "v*"                # y también al subir una etiqueta tipo v1.0.0

jobs:
  # Genera el instalador. Los mods NO se compilan acá: los compilás en tu PC (npm run build:mod)
  # y los subís con npm run publish:mods; el launcher baja el de la versión que elija el usuario.
  instalador:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Instalar dependencias
        run: npm ci

      - name: Mods incluidos
        shell: bash
        run: |
          ls -1 mod 2>/dev/null || echo "Sin jars dentro del instalador: el launcher los baja del release mods-rolling."

      # Al subir una etiqueta vX.Y.Z, la versión del launcher pasa a ser X.Y.Z automáticamente.
      - name: Poner la versión de la etiqueta
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        run: npm version "${GITHUB_REF_NAME#v}" --no-git-tag-version --allow-same-version

      - name: Compilar instalador (.exe)
        shell: bash
        run: |
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            npx electron-builder --win nsis --publish always   # crea el release con el .exe y latest.yml
          else
            npx electron-builder --win nsis --publish never
          fi
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: "false"   # sin firma de código
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Subir instalador
        uses: actions/upload-artifact@v4
        with:
          name: Nova-Launcher-Setup
          path: dist/*.exe
